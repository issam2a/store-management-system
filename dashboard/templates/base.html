{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html
    lang="{{ LANGUAGE_CODE }}"
    dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="{% trans 'Store management and retail operations platform' %}"
    >

    <title>
        {% block title %}StoreFlow{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'dashboard/css/app.css' %}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Animated atmospheric background -->
    <div class="app-background" aria-hidden="true">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>
    </div>

    <!-- Application shell -->
    <div class="app-shell">

        {% include "components/sidebar.html" %}

        <div class="app-main">

            {% include "components/topbar.html" %}

            <main class="page-content">
                {% block content %}{% endblock %}
            </main>

        </div>

    </div>

    <script src="{% static 'dashboard/js/app.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
